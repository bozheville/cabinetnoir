<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 3" width="30" height="3">
  <title>Stitch tile (repeat-x). Swap stroke colour per thread: cream #f3e9d2, linen #d9c4a0, brown #7a5a36, gold #e2c47a</title>
  <!-- shadow of the thread pressed into the leather -->
  <path d="M2 2 H8 M12 2 H18 M22 2 H28" stroke="#000" stroke-opacity=".35" stroke-width="1" stroke-linecap="round"/>
  <!-- thread: 6px dash, 4px gap; tile = 3 dashes so seams do not show -->
  <path d="M2 1 H8 M12 1 H18 M22 1 H28" stroke="#f3e9d2" stroke-width="1.5" stroke-linecap="round"/>
</svg>
